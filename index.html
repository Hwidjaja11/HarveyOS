<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HarveyOS</title>
<style>
:root{--ac:#ff8fb8;--bg:#fff6fb;--panel:rgba(255,255,255,.72);--tx:#3b3350;--bd:rgba(120,100,160,.2);--sh:0 12px 40px rgba(90,60,140,.25);--wall:linear-gradient(135deg,#ffd6e8,#cfe6ff 50%,#d4ffec);box-sizing:border-box}
:root[data-dark=true]{--bg:#1e1a2b;--panel:rgba(40,34,60,.78);--tx:#f1eaff;--bd:rgba(255,255,255,.14);--sh:0 12px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
html,body{height:100%;overflow:hidden;color:var(--tx);background:var(--bg)}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:var(--panel);color:var(--tx);border:1px solid var(--bd)}
input,select,textarea{border:1px solid var(--bd);border-radius:10px;padding:9px 12px;background:var(--panel);color:var(--tx);font-size:14px;width:100%}
#screen{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wall{background:var(--wall);background-size:cover}
.center{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:14px;padding:16px}
.card{background:var(--panel);backdrop-filter:blur(22px);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:24px;width:min(380px,92vw);display:flex;flex-direction:column;gap:12px;text-align:center}
.users{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.u{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;font-weight:700;box-shadow:var(--sh);border:3px solid #fff}
.err{color:#e0426b;font-size:13px;min-height:16px}
.logo{filter:drop-shadow(0 6px 10px rgba(120,80,170,.3))}
#boot{background:#1e1a2b;color:#fff;z-index:99}
.bar{width:180px;height:6px;background:#ffffff30;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width 1.6s}
#mb{position:absolute;top:0;left:0;right:0;height:30px;background:var(--panel);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 10px;gap:14px;font-size:13px;z-index:5000;padding-top:env(safe-area-inset-top,0px);height:calc(30px + env(safe-area-inset-top,0px))}
#mb b{cursor:pointer}#mb .sp{flex:1}
#desk{position:absolute;inset:30px 0 0 0}
.ico{position:absolute;width:76px;text-align:center;font-size:12px;cursor:pointer;padding:6px;border-radius:12px;user-select:none}
.ico:hover{background:#ffffff55}.ico .e{font-size:34px}
#dock{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel);backdrop-filter:blur(22px);border:1px solid var(--bd);border-radius:22px;padding:8px 12px;box-shadow:var(--sh);z-index:5000;max-width:96vw;overflow-x:auto}
.d{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:24px;cursor:pointer;position:relative;background:#ffffff66;flex:none;transition:transform .15s}
.d:hover{transform:translateY(-6px) scale(1.15)}.d.on::after{content:"";position:absolute;bottom:-5px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.sep{width:1px;height:30px;background:var(--bd)}
#start{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);width:min(340px,92vw);z-index:5001;display:none}
#start.show{display:flex}
.win{position:absolute;background:var(--panel);backdrop-filter:blur(26px);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;min-width:260px;min-height:140px}
.tb{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:grab;background:#ffffff40;font-size:13px;font-weight:600;flex:none;user-select:none}
.tl{width:13px;height:13px;border-radius:50%;cursor:pointer;display:inline-block}
.body{flex:1;overflow:auto;padding:12px;position:relative}
.win.max{inset:0 !important;width:auto !important;height:auto !important;border-radius:0}
.win.xp{border-radius:4px;background:#ece9f4;color:#000;border:2px solid #4a6fd8}
.win.xp .tb{background:linear-gradient(#4a8cf0,#2250c8);color:#fff}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.calc .s{grid-column:1/-1;text-align:right;font-size:28px;padding:10px;background:#ffffff66;border-radius:10px;min-height:52px;overflow:hidden}
.calc button{padding:14px 0;font-size:16px}.calc .o{background:#9ec8ff}.calc .n{background:var(--panel);color:var(--tx);border:1px solid var(--bd)}
.term{background:#1b1730;color:#c9ffe3;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;height:100%;padding:10px;overflow:auto;white-space:pre-wrap}
.term *{font-family:inherit}.term input{background:none;border:0;color:#fff;width:70%;padding:0;outline:0}
.ttt{display:grid;grid-template-columns:repeat(3,80px);gap:6px;justify-content:center}.ttt button{height:80px;font-size:34px;background:var(--panel);color:var(--tx);border:1px solid var(--bd)}
.sw{width:30px;height:30px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid #fff;margin:3px;box-shadow:0 2px 6px #0003}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
#toast{position:fixed;top:44px;right:12px;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;z-index:9999;box-shadow:var(--sh);display:none;max-width:260px;font-size:13px}
.hid{display:none!important}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes fi{from{opacity:0;transform:translateY(8px)}}@keyframes bn{50%{transform:translateY(-8px);opacity:.4}}
.pop{animation:pop 1s ease-out both}.spin{animation:sp 1.4s cubic-bezier(.6,0,.3,1) infinite}.fi{animation:fi 1s .6s both}.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--ac);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}.key{flex:1;height:110px;font-size:12px;background:#fff;color:#333;border:1px solid var(--bd);border-radius:0 0 8px 8px}.key.k{background:#3b3350;color:#fff;height:70px}.t2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(300px,100%);margin:auto}.t2 div{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-weight:700;font-size:20px;background:#ffffff80}
@media (prefers-color-scheme:dark){:root:not([data-dark=false]){--bg:#1e1a2b;--panel:rgba(40,34,60,.78);--tx:#f1eaff;--bd:rgba(255,255,255,.14)}}
</style></head><body>
<div id="screen" class="wall"></div><div id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const LOGO=(s=64)=>`<svg class="logo" width="${s}" height="${s}" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ec7"/><stop offset=".5" stop-color="#9ecbff"/><stop offset="1" stop-color="#9dffd3"/></linearGradient></defs><rect x="4" y="4" width="56" height="56" rx="16" fill="url(#lg)"/><path d="M19 17v30M45 17v30M19 32h26" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"/><circle cx="48" cy="14" r="5" fill="#fff6a8"/></svg>`;
let db={users:{},last:null};
try{db=JSON.parse(localStorage.getItem('harveyos')||'')||db}catch(e){}
const save=()=>{try{localStorage.setItem('harveyos',JSON.stringify(db))}catch(e){}};
let me=null,Z=10,wins={},tmr;
const WALLS={Pastel:'linear-gradient(135deg,#ffd6e8,#cfe6ff 50%,#d4ffec)',Sunset:'linear-gradient(135deg,#ffe3a8,#ff9ec7 60%,#b79bff)',Mint:'linear-gradient(160deg,#c9ffe9,#a8d8ff)',Night:'linear-gradient(135deg,#2a2150,#5a3d8a 60%,#d46ba0)'};
const COLS=['#ff8fb8','#7db8ff','#5fd6a4','#ffc94d','#b08cff','#ff7a6b'];
const toast=(t,ms=5000)=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tmr);tmr=setTimeout(()=>e.style.display='none',ms)};
function theme(){const s=me?me.set:{};const r=document.documentElement;r.style.setProperty('--ac',s.ac||COLS[0]);r.style.setProperty('--wall',WALLS[s.wall||'Pastel']);r.dataset.dark=s.dark?'true':(s.dark===false?'false':'');}
const scr=$('#screen');
/* ---------- BOOT ---------- */
function boot(){scr.className='';scr.innerHTML=`<div id="boot" class="center" style="position:absolute;inset:0">${LOGO(96)}<h2 style="letter-spacing:4px">HarveyOS</h2><div class="bar"><i></i></div></div>`;setTimeout(()=>$('.bar i').style.width='100%',50);setTimeout(loginScreen,1900)}
/* ---------- LOGIN ---------- */
function loginScreen(){me=null;theme();wins={};scr.className='wall';const names=Object.keys(db.users);
scr.innerHTML=`<div class="center">${LOGO(80)}<h1>HarveyOS</h1><div class="users">${names.map(n=>`<div class="u" data-n="${n}"><div class="av" style="background:${db.users[n].col}">${n[0].toUpperCase()}</div>${n}</div>`).join('')}<div class="u" id="add"><div class="av" style="background:#b9b3d0">+</div>New account</div></div><div style="font-size:12px;opacity:.6">Secured by LFA · Lots of Factors Authentication</div></div>`;
document.querySelectorAll('.u[data-n]').forEach(e=>e.onclick=()=>pwStep(e.dataset.n));$('#add').onclick=signup;if(!names.length)signup()}
function signup(){scr.innerHTML=`<div class="center"><div class="card">${LOGO(56)}<h2>Create account</h2><input id="n" placeholder="Username"><input id="p" type="password" placeholder="Password"><label style="font-size:13px"><input id="l" type="checkbox" style="width:auto" checked> Enable LFA (Lots of Factors Authentication)</label><div class="err" id="e"></div><button id="go">Create</button><button class="g" id="bk">Back</button></div></div>`;
$('#bk').onclick=loginScreen;$('#go').onclick=()=>{const n=$('#n').value.trim(),p=$('#p').value;if(!n||!p)return $('#e').textContent='Fill everything in!';if(db.users[n])return $('#e').textContent='That name is taken.';
db.users[n]={pw:btoa(p),lfa:$('#l').checked,col:COLS[Object.keys(db.users).length%COLS.length],set:{ac:COLS[0],wall:'Pastel'},notes:''};save();loginScreen()}}
function pwStep(n){const u=db.users[n];scr.innerHTML=`<div class="center"><div class="card"><div class="av" style="background:${u.col};align-self:center">${n[0].toUpperCase()}</div><h2>${n}</h2><input id="p" type="password" placeholder="Password" autofocus><div class="err" id="e"></div><button id="go">Continue</button><button class="g" id="bk">Back</button></div></div>`;
$('#bk').onclick=loginScreen;const go=()=>{if(btoa($('#p').value)!==u.pw)return $('#e').textContent='Wrong password.';u.lfa?lfa(n,1):enter(n)};$('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>$('#p').focus(),30)}
function lfa(n,step){const code=String(Math.floor(100000+Math.random()*900000));let h='';
if(step===1){h=`<h3>LFA 1/3 · Text code</h3><p style="font-size:13px">We “texted” you a 6-digit code.</p><input id="c" placeholder="000000" maxlength="6">`;toast('📱 HarveyOS code: '+code,15000)}
if(step===2)h=`<h3>LFA 2/3 · Passkey</h3><p style="font-size:13px">Use your passkey to continue.</p><button id="pk" style="font-size:22px">🔐 Use passkey</button>`;
if(step===3)h=`<h3>LFA 3/3 · Human check</h3><label class="row"><input type="checkbox" id="hc" style="width:auto"> I am not a robot (probably)</label><p style="font-size:13px">What is 7 × 6?</p><input id="c">`;
scr.innerHTML=`<div class="center"><div class="card">${h}<div class="err" id="e"></div><button id="go">${step===2?'Verify':'Next'}</button></div></div>`;
const nx=()=>step<3?lfa(n,step+1):enter(n);
$('#go').onclick=()=>{if(step===1&&$('#c').value!==code)return $('#e').textContent='Code does not match.';if(step===3&&(!$('#hc').checked||$('#c').value!=='42'))return $('#e').textContent='Robot detected. Try again.';if(step===2){$('#go').textContent='Verifying…';return setTimeout(nx,900)}nx()};if(step===2)$('#pk').onclick=()=>$('#go').click()}
function enter(n){me=db.users[n];me.name=n;db.last=n;save();theme();desktop()}
/* ---------- DESKTOP ---------- */
const APPS={calc:['🧮','Calculator',300,420],notes:['📝','Notes',360,360],term:['⌨️','Terminal',520,340],set:['⚙️','Settings',400,420],snake:['🐍','Snake',340,400],ttt:['⭕','Tic-Tac-Toe',320,380],clock:['⏱️','Clock',300,260],files:['📁','Files',360,300]};
function desktop(){scr.innerHTML=`<div id="mb"><b id="logo">${LOGO(18)} HarveyOS</b><span id="act">Desktop</span><span class="sp"></span><span id="cl"></span><b id="usr">👤 ${me.name}</b></div><div id="desk"></div><div id="start" class="card"></div><div id="dock"></div>`;
const d=$('#desk');Object.keys(APPS).slice(0,6).forEach((k,i)=>{const a=APPS[k],e=document.createElement('div');e.className='ico';e.style.cssText=`left:${14+Math.floor(i/5)*84}px;top:${14+(i%5)*84}px`;e.innerHTML=`<div class="e">${a[0]}</div>${a[1]}`;e.ondblclick=()=>openApp(k);e.onclick=()=>innerWidth<700&&openApp(k);d.appendChild(e)});
$('#logo').onclick=$('#usr').onclick=e=>{e.stopPropagation();menu(e.currentTarget.id)};document.onclick=()=>$('#start').classList.remove('show');
dock();setInterval(()=>{const c=$('#cl');if(c)c.textContent=new Date().toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})},1000);
setTimeout(()=>{openApp('term');if(!me.seen){me.seen=1;save();openApp('guide')}},300);$('#mb .sp').insertAdjacentHTML('afterend','<b id="sr" title="Search (Alt+Space)">'+IC('search',16)+'</b>');$('#sr').onclick=e=>{e.stopPropagation();spot()};hotkeys()}
function menu(w){const s=$('#start');s.classList.add('show');s.onclick=e=>e.stopPropagation();
s.innerHTML=w==='logo'?`<h3>HarveyOS</h3>`+Object.keys(APPS).map(k=>`<button class="g" data-a="${k}">${APPS[k][0]} ${APPS[k][1]}</button>`).join('')+`<button class="g" id="x1">🔒 Lock</button><button id="x2">Sign out</button>`:`<div class="av" style="background:${me.col};align-self:center">${me.name[0].toUpperCase()}</div><b>${me.name}</b><button class="g" id="x1">🔒 Lock</button><button class="g" id="x3">Switch account</button><button id="x2">Sign out</button>`;
s.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{openApp(b.dataset.a);s.classList.remove('show')});
const x1=$('#x1'),x2=$('#x2'),x3=$('#x3');x1&&(x1.onclick=lock);x2&&(x2.onclick=signOut);x3&&(x3.onclick=signOut)}
function lock(){const n=me.name,u=me;const o=document.createElement('div');o.className='wall center';o.style.cssText='position:absolute;inset:0;z-index:99999';o.innerHTML=`<h1 style="font-size:64px">${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</h1><div class="card"><div class="av" style="background:${u.col};align-self:center">${n[0].toUpperCase()}</div><b>${n} · Locked</b><input id="lp" type="password" placeholder="Password"><div class="err" id="le"></div></div>`;scr.appendChild(o);
$('#lp').onkeydown=e=>{if(e.key==='Enter'){btoa(e.target.value)===u.pw?o.remove():$('#le').textContent='Wrong password.'}}}
function dock(){const d=$('#dock');d.innerHTML=Object.keys(APPS).map(k=>`<div class="d ${Object.values(wins).some(w=>w.k===k)?'on':''}" data-k="${k}" title="${APPS[k][1]}">${APPS[k][0]}</div>`).join('')+`<div class="sep"></div><div class="d" id="lk" title="Lock">🔒</div>`;
d.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>openApp(e.dataset.k));$('#lk').onclick=lock}
/* ---------- WINDOWS ---------- */
function mkWin(k,title,w,h,html,cls=''){const id='w'+(++Z);const el=document.createElement('div');el.className='win '+cls;const dw=$('#desk').clientWidth,dh=$('#desk').clientHeight;w=Math.min(w,dw-10);h=Math.min(h,dh-80);
el.style.cssText=`width:${w}px;height:${h}px;left:${Math.max(4,(dw-w)/2+(Z%6)*22-60)}px;top:${Math.max(4,40+(Z%6)*22)}px;z-index:${Z}`;
el.innerHTML=`<div class="tb"><span class="tl" style="background:#ff6b6b" data-b="x"></span><span class="tl" style="background:#ffd24d" data-b="m"></span><span class="tl" style="background:#5fe0a0" data-b="z"></span><span style="margin-left:6px">${title}</span></div><div class="body">${html}</div>`;
$('#desk').appendChild(el);wins[id]={k,el};
const f=()=>{el.style.zIndex=++Z;$('#act').textContent=title};el.onmousedown=f;f();
el.querySelector('[data-b=x]').onclick=()=>{el.remove();delete wins[id];dock()};el.querySelector('[data-b=m]').onclick=()=>el.classList.toggle('hid');el.querySelector('[data-b=z]').onclick=()=>el.classList.toggle('max');
const tb=el.querySelector('.tb');tb.onpointerdown=e=>{if(e.target.dataset.b||el.classList.contains('max'))return;const ox=e.clientX-el.offsetLeft,oy=e.clientY-el.offsetTop;tb.setPointerCapture(e.pointerId);tb.onpointermove=m=>{el.style.left=m.clientX-ox+'px';el.style.top=Math.max(0,m.clientY-oy)+'px'};tb.onpointerup=()=>tb.onpointermove=null};
dock();return el}
function openApp(k,arg){const a=APPS[k];if(!a)return;let ex=Object.values(wins).find(w=>w.k===k);if(ex&&k!=='term'){ex.el.classList.remove('hid');ex.el.style.zIndex=++Z;return}
const el=mkWin(k,a[0]+' '+a[1],a[2],a[3],'');const b=el.querySelector('.body');APP[k](b,el,arg)}
function bsod(code){const el=mkWin('err','HarveyOS',380,190,`<div style="display:flex;gap:14px;color:#000;font-size:13px;align-items:flex-start"><span style="font-size:38px;background:#e03030;color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;flex:none">✖</span><div>A fatal exception <b>${code}</b> has occurred at 0028:C0011E36 in VXD VMM(01). The current application will be terminated.<br><br>Press OK to continue.</div></div><div style="text-align:right;margin-top:14px"><button style="background:#ddd;color:#000;border:2px outset #fff;border-radius:2px;padding:4px 28px" id="ok">OK</button></div>`,'xp');el.querySelector('#ok').onclick=()=>el.querySelector('[data-b=x]').click()}
/* ---------- APPS ---------- */
const APP={
calc(b){let v='';b.innerHTML=`<div class="calc"><div class="s" id="s">0</div>${'C ( ) /|7|8|9|*|4|5|6|-|1|2|3|+|0|.|⌫|='.replace('C ( ) /','C|(|)|/').split('|').map(x=>`<button class="${/[0-9.]/.test(x)?'n':'o'}">${x}</button>`).join('')}</div>`;
const s=$('#s',b);b.querySelectorAll('button').forEach(e=>e.onclick=()=>{const x=e.textContent;if(x==='C')v='';else if(x==='⌫')v=v.slice(0,-1);else if(x==='='){try{v=String(+(Function('return '+v)()).toFixed(8))}catch(_){v='Error'}}else v=(v==='Error'?'':v)+x;s.textContent=v||'0'})},
notes(b){b.style.padding=0;b.innerHTML=`<textarea style="height:100%;border:0;border-radius:0;resize:none" placeholder="Write something…"></textarea>`;const t=$('textarea',b);t.value=me.notes||'';t.oninput=()=>{me.notes=t.value;save()}},
clock(b){let t0=0,run=0,el=0;b.innerHTML=`<h1 id="t" style="text-align:center;font-size:40px"></h1><h2 id="sw" style="text-align:center">0.0s</h2><div class="row" style="justify-content:center"><button id="a">Start</button><button class="g" id="r">Reset</button></div>`;
const iv=setInterval(()=>{if(!b.isConnected)return clearInterval(iv);$('#t',b).textContent=new Date().toLocaleTimeString();if(run)$('#sw',b).textContent=((el+Date.now()-t0)/1000).toFixed(1)+'s'},100);
$('#a',b).onclick=e=>{if(run){el+=Date.now()-t0;run=0;e.target.textContent='Start'}else{t0=Date.now();run=1;e.target.textContent='Stop'}};$('#r',b).onclick=()=>{el=0;run=0;$('#a',b).textContent='Start';$('#sw',b).textContent='0.0s'}},

ttt(b){let g=Array(9).fill(''),done=0;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const win=p=>L.some(l=>l.every(i=>g[i]===p));

{t:'Start here',i:'tguide',intro:'<div class="tgi">The <b>Terminal</b> lets you control HarveyOS by typing short instructions called <b>commands</b>. You type a command, press <b>Enter</b>, and HarveyOS does it and prints the answer.<br><br><b>Open it:</b> click the Terminal icon in the dock, press <code>Alt</code>+<code>T</code>, or search for it with <code>Alt</code>+<code>Space</code>.<br><br><b>Read the prompt.</b> The text before your cursor looks like <code>yourname@harvey:/Documents$</code>. That means: <i>your name</i> @ harvey, then <i>the folder you are in</i>, then <code>$</code> which means “ready for a command”.<br><br>The <b>Try</b> buttons below open a fresh Terminal and run that command for you. <b>Copy</b> copies it so you can paste it yourself.</div>',items:[
['help','Lists the commands you can use. A great first stop any time you forget something.'],
['whoami','Prints the name of the account you are signed in as.','yourname'],
['date','Shows today’s date and time.'],
['history','Lists the commands you have typed in this Terminal window. Tip: press the <b>Up arrow</b> to bring back your last command and the <b>Down arrow</b> to move forward again. It saves lots of typing.'],
['clear','Wipes the screen so it looks tidy again. Nothing is deleted. Only the text on screen goes away.']]},
{t:'Where am I? (folders and paths)',i:'files',intro:'<div class="tgi">Files live inside <b>folders</b>, and folders can sit inside other folders, like boxes inside boxes. The very top is called <b>the root</b> and is written <code>/</code>.<br><br>A <b>path</b> is the address of something, for example <code>/Documents/welcome.txt</code>.<br>• A path that starts with <code>/</code> always starts from the top (an <b>absolute</b> path).<br>• A path that does <i>not</i> start with <code>/</code> starts from where you are now (a <b>relative</b> path).<br>• <code>..</code> means “the folder above this one”.<br><br>Folder names are case-sensitive: <code>Documents</code> and <code>documents</code> are different. Avoid spaces in names you create, because commands split on spaces.</div>',items:[
['pwd','“Print working directory”. Shows the folder you are in right now.','/'],
['ls','Lists what is inside the current folder. Folders end with a <code>/</code>.','Apps/  Documents/  Music/  Pictures/'],
['ls -l','Same list but with details. <code>d</code> means folder, <code>-</code> means file, and the number is the size in characters.','d        0  Apps\nd        0  Documents'],
['ls /Documents','You can also list a different folder without going there. Put its path after <code>ls</code>.','Notes/  welcome.txt'],
['cd Documents','“Change directory”. Moves you into the Documents folder. The prompt changes to show it.','yourname@harvey:/Documents$',''],
['cd ..','Goes up one level, out of the folder you are in.','','x'],
['cd /','Jumps straight back to the top, no matter where you are.','','x'],
['tree','Draws every folder and file as a little family tree. Add a path to draw just one folder, like <code>tree /Apps</code>.','/\n├─ Apps/\n│  └─ Flappy/\n└─ Documents/\n   └─ welcome.txt']]},
{t:'Files and folders',i:'file',intro:'<div class="tgi">These commands make, read, copy, move and delete things. Anything you change here shows up in the <b>File Explorer</b> app too, and the other way around.<br><br><b>Handy 5-step example</b> (type these in the same Terminal, one at a time):<br>1. <code>mkdir school</code> makes a folder<br>2. <code>cd school</code> goes inside it<br>3. <code>echo Math homework > todo.txt</code> creates a file with text in it<br>4. <code>cat todo.txt</code> shows the text<br>5. <code>cd ..</code> then <code>rm -r school</code> deletes it again (it will ask you first)</div>',items:[
['mkdir school','Makes a new folder called <b>school</b> in the folder you are in.','created /school'],
['touch notes.txt','Makes a new empty file. If the file already exists, nothing happens.'],
['echo Hello there > hello.txt','The <code>&gt;</code> sends the words into a file instead of the screen. This <b>replaces</b> whatever was in the file.'],
['echo One more line >> hello.txt','Two arrows <code>&gt;&gt;</code> mean <b>add to the end</b> of the file instead of replacing it.','','x'],
['cat Documents/welcome.txt','Prints what is inside a file so you can read it.','Welcome to HarveyOS! ...'],
['edit Documents/welcome.txt','Opens the file in a text editor window so you can change it.'],
['cp hello.txt copy.txt','Copies a file (or a whole folder) to a new name or place.','copied to /copy.txt','x'],
['mv copy.txt Documents','Moves something into another folder. If the second name is not an existing folder, <code>mv</code> simply <b>renames</b> it.','moved to /Documents/copy.txt','x'],

['find welcome','Searches every path for a word and lists the matches.','/Documents/welcome.txt'],
['du','Counts your files and how much space they use.','12 files, 4.2 KB']]},
{t:'Apps and the desktop',i:'grid',intro:'<div class="tgi">You can launch apps, change how HarveyOS looks and manage the dock from the Terminal. Every app has a short <b>id</b> that you type after <code>open</code>. See the full list of ids at the bottom of this page.</div>',items:[
['apps','Prints the id of every app.'],
['open calc','Opens the Calculator. Works for any id, like <code>open paint</code> or <code>open redstone</code>.'],
['open Documents/welcome.txt','Give <code>open</code> a file path instead of an app and it opens the file in the editor.'],
['pin snake','Adds an app to the dock. Use <code>unpin snake</code> to take it off. You can do the same by right-clicking an app.','','x'],
['theme sunset','Changes the wallpaper theme. Type <code>theme</code> by itself to see the choices: pastel, sunset, mint, night, aurora, grid, dusk.','','x'],

['storage','Shows how much of your browser’s storage HarveyOS is using.','Browser storage: 640 KB of about 5120 KB (12.5%)'],
['about','Shows the About HarveyOS window (a blue “i” window).'],

{t:'Signing out, restarting and crashing',i:'lock',intro:'<div class="tgi">Some commands change your whole session, so HarveyOS asks you to confirm them. Look at the little picture in the popup:<br>• <b>Blue circle with an “i”</b> = information or a question<br>• <b>Yellow triangle with “!”</b> = warning, be careful<br>• <b>Red circle with an “X”</b> = an error<br><br>Press <b>Enter</b> for the first button (like Yes or OK) or <b>Esc</b> to cancel.</div>',items:[
['lock','Locks the screen. Type your password to get back in. Nothing is closed or saved differently.'],
['logout','Asks “Do you want to sign out?” (blue “i”). Choose <b>Sign out</b> to leave. The same thing works with <code>signout</code>, <code>exit</code> or <code>shutdown</code>.'],
['reboot','Asks first, then restarts HarveyOS with the startup animation and puts you back on your desktop. Your files and settings are safe.'],
['crash','A <b>fake crash</b> for fun. It asks “ARE YOU SURE?” three times (blue “i”), then a yellow “!” window says <b>Press OK to crash</b>. After the pretend blue crash screen you land back on your desktop with your wallpaper, files and settings exactly as they were. Say No at any point to stop.']]},
{t:'Popups and error windows',i:'bot',intro:'<div class="tgi">HarveyOS has three kinds of classic popup windows, and you can create them yourself to see what they look like.</div>',items:[

['dialog error 0 3 Something broke','The <code>0</code> in the title spot means \u201cuse the default title\u201d. The <code>3</code> opens <b>three</b> red \u201cX\u201d windows stacked on top of each other. Close them one at a time. You can ask for 1 to 20. With more than one, the windows land at random spots near the middle. Ask for more than 20 and HarveyOS does a (safe) crash screen.'],
['dialog info MyTitle','Just a title: one word with no quotes works too. The count is 1 and the message is the default.'],
['dialog ask Question 1 Do you like pizza?','A question with <b>Yes</b> and <b>No</b> buttons. When you close them the Terminal prints your answers. Opening several at once prints one answer for each.'],
['error 0x0000007B','Pretends the system hit a fatal error and shows the classic error window. Use any code you like.'],
['bsod','Another pretend error window with a different code.'],
['rm -rf /','A joke command. HarveyOS says “nice try” and shows an error window. <b>Nothing is deleted.</b>']]},
{t:'Fun extras',i:'dice',intro:'<div class="tgi">Just for enjoyment, and a couple of handy tools.</div>',items:[

{t:'Where your app data lives',i:'lfa',intro:'<div class="tgi">HarveyOS keeps each app’s saved data as <b>real files</b> in the <code>/Apps</code> folder, for example high scores, your to-do list and your Redstone designs. You can read them with the Terminal and even edit them: change a number and the app picks it up a moment later.<br><br>Folder names such as <code>Code Runner</code> contain a space, so the Terminal can’t type them. Use the <b>File Explorer</b> app for those.</div>',items:[

tick=()=>{if(!b.isConnected)return clearInterval(tm);if(over)return;if(!hit(P.m,P.x,P.y+1))P.y++;else lock();draw()},mv=d=>{if(over||!P)return;if(!hit(P.m,P.x+d,P.y))P.x+=d;draw()},ro=()=>{if(over)return;const m=rot(P.m);for(const k of[0,-1,1,-2,2])if(!hit(m,P.x+k,P.y)){P.m=m;P.x+=k;break}draw()},dn=()=>{if(over)return;if(!hit(P.m,P.x,P.y+1)){P.y++;sc++}else lock();draw()},hd=()=>{if(over)return;while(!hit(P.m,P.x,P.y+1)){P.y++;sc+=2}lock();draw()};
const cell=(g,x,y,col,s)=>{g.fillStyle=col;g.fillRect(x*s+1,y*s+1,s-2,s-2);g.fillStyle='#ffffff44';g.fillRect(x*s+1,y*s+1,s-2,4)},draw=()=>{c.clearRect(0,0,W*S,H*S);B.forEach((r,y)=>r.forEach((v,x)=>{if(v)cell(c,x,y,v,S)}));if(!over)P.m.forEach((r,j)=>r.forEach((v,i)=>{if(v)cell(c,P.x+i,P.y+j,P.c,S)}));nx.clearRect(0,0,80,60);N.m.forEach((r,j)=>r.forEach((v,i)=>{if(v)cell(nx,i,j,N.c,14)}));$('#sc',b).textContent=sc;$('#ln',b).textContent=ln;$('#lv',b).textContent=1+(ln/10|0);if(over){c.fillStyle='#000a';c.fillRect(0,0,W*S,H*S);c.fillStyle='#fff';c.font='bold 18px sans-serif';c.textAlign='center';c.fillText('Game over',W*S/2,H*S/2)}};

/* ---------- Changelog ---------- */
const VER='2.1';
APP.clog=b=>{const L=[
['2.1','This update','New',[['Look','Every dropdown and colour picker now matches HarveyOS: rounded glass menus and a colour picker with presets, sliders and a hex box, instead of the plain browser ones.'],['Popups','Popups no longer block the screen. You can click, type and drag in other windows while a popup is open. There is now only one soft dim layer behind them, however many are open. Enter and Esc only affect a popup when it is the thing you are using.'],['Terminal','<code>dialog</code> with several windows scatters them at random spots near the middle. Asking for more than 20 windows, or any unexpected Terminal error, now triggers the same safe crash screen as <code>crash</code>.'],['File Explorer','Files is now <b>File Explorer</b>, with a path bar, New folder and New file. Right-click any file or folder to <b>Rename</b>, <b>Move to\u2026</b> another folder, add it to the desktop or delete it. Desktop shortcuts follow when you rename or move.'],['App folders','Right-click an app on the desktop and choose <b>Create folder\u2026</b>, name it, then drag more app icons onto the folder. Double-click a folder to see what is inside. All the apps from this update live in a <b>New Apps</b> folder, and nothing on your desktop was moved or covered.'],['Better apps','<b>Clock</b> has an analogue clock, a stopwatch with laps and alarms that really ring. <b>Timer</b> has a progress ring, custom hours/minutes/seconds, labels and repeat. <b>Calculator</b> has scientific mode, history and keyboard input. <b>To-Do</b> has priorities, editing, filters and undo. <b>Converter</b> has many more units and a swap button. <b>Snake</b> has speeds, a walls option and a saved best score.'],['New apps','Tip &amp; Split, Habit Tracker, Spin Wheel, Dev Toolkit, Flashcards, Drum Pad, and the games Pong, Connect Four, Simon Says, Slide Puzzle, Lights Out, Hangman, Typing Test and Blocks (Tetris-style). Plus this Changelog.']]],
['2.0','Memory, Notes and popups','',[['Memory Management','See everything HarveyOS remembers, organised by category, and make a backup code that carries your whole setup (files, notes, desktop layout, settings) to another browser.'],['/Apps folder','Each app\u2019s saved data now lives as real files, for example high scores in <code>/Apps/Flappy/highscore.json</code>. Edit a file and the app picks it up.'],['Dialog windows','Classic popup windows: blue \u201ci\u201d for information and questions, yellow \u201c!\u201d for warnings, red \u201cX\u201d for errors. Choose the Current or the Classic (old Windows) look in Settings, for all popups or one kind at a time.'],['Terminal 2.0','Real files from the Terminal: <code>cd</code>, <code>ls</code>, <code>cat</code>, <code>mkdir</code>, <code>mv</code>, <code>rm</code> and more, <code>echo &gt; file</code>, confirmations for risky commands, and a fake <code>crash</code> with three \u201care you sure?\u201d checks.'],['Notes and Piano','Notes saves real files with New/Save/Save as/Delete. The Piano has 3 octaves, 6 instruments, reverb, sustain, recording and songs.']]],
['1.7','Terminal and sign-in polish','',[['Terminal Guide','A plain-language guide to every Terminal command, with Try buttons.'],['Dev Override','Needs the dev password and shows a 5-second authenticating bar.'],['dialog command','<code>dialog &lt;type&gt; [title|0] [count] [message]</code>.'],['Crash fix','The wallpaper now comes back correctly after a crash or reboot.']]],
['1.5','Redstone Lab','',[['Redstone Lab','A pixel-art redstone simulator with dust, torches, repeaters, levers, buttons and lamps, saved designs and example circuits.']]],
['1.3','Code, weather and desktop control','',[['Code Runner','Run JavaScript or a lite Python.'],['More apps','Weather snapshot, World Clock, Color Lab, Text Tools, Breakout, Flappy, Reaction, Whack-a-Mole, Word Guess, Wallpaper.'],['Desktop','Every app on the desktop by default, pin or unpin from the dock, undo in Paint and Notes.']]],
['1.2','Smoother windows','',[['Windows','Windows shrink into the dock, snap to screen edges and resize from the corner.'],['Desktop','Drag icons, rename them with a double-click, and put files on the wallpaper.']]],
['1.1','Icons and utilities','',[['Icons','A custom SVG icon set replaced emojis.'],['Apps','2048, Minesweeper, Memory, Converter, Timer, Password Maker, Monitor, Piano and Guide, plus startup animations, search (Alt+Space) and hotkeys.']]],
['1.0','Hello, HarveyOS','',[['Foundation','Accounts with LFA (Lots of Factors Authentication), lock and sign out, a menu bar and dock, draggable windows, Calculator, Notes, Terminal, Settings, Snake, Tic-Tac-Toe, Clock and Files.']]]];

async function playSnd(k){if(!sndOn())return;const n=performance.now();if(n-_sl<60&&k!=='test')return;_sl=n;try{const a=_sc||(_sc=new(window.AudioContext||window.webkitAudioContext)());if(a.state==='suspended')a.resume();let buf=_sb[k];if(!buf){const bin=atob(SND[k].split(',')[1]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);buf=_sb[k]=await a.decodeAudioData(u.buffer)}const s=a.createBufferSource(),g=a.createGain();g.gain.value=sndVol();s.buffer=buf;s.connect(g);g.connect(a.destination);s.start()}catch(e){}}
